{% extends 'auth/form.html' %}{% block title %}Sign up · Code Archaeologist{% endblock %}{% block form_content %}<p class="eyebrow">START EXPLORING</p><h1>Create your workspace.</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input required type="text" name="name" minlength="2" autocomplete="name"></label><label>Email<input required type="email" name="email" autocomplete="email"></label><label>Password <small>8+ characters</small><input required type="password" name="password" minlength="8" autocomplete="new-password"></label><button class="button" type="submit">Create account</button></form><p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>{% endblock %}
